[package]
name = "engine_audio_native"
version = "0.1.0"
edition = "2021"
rust-version = "1.94"
license = "MIT"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
godot = { version = "=0.5.5", features = ["api-4-7", "experimental-threads"] }
godot-core = "=0.5.5"

[profile.release]
lto = "thin"
codegen-units = 1
